<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>three-vrm with VRMA animation</title>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<style>
			body {
				margin: 0;
				font-family: 'Inter', sans-serif;
				overflow: hidden;
			}
			canvas {
				display: block;
				width: 100vw;
				height: 100vh;
			}
			/* --- Main Controls Panel Styling --- */
			.controls {
				position: absolute;
				top: 10px;
				left: 10px;
				background: rgba(0, 0, 0, 0.8);
				color: white;
				padding: 20px;
				border-radius: 12px;
				z-index: 100;
				display: flex;
				flex-direction: column;
				gap: 12px;
				box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
				transition: transform 0.3s ease, opacity 0.3s ease;
			}
			.controls.hidden {
				transform: translateX(-110%);
				opacity: 0;
				pointer-events: none;
			}

			/* --- Status Panel Styling --- */
			#statusPanel {
				position: absolute;
				top: 10px;
				right: 10px;
				background: rgba(0, 0, 0, 0.8);
				color: #aaffaa; /* Light green text for status */
				padding: 10px 15px;
				border-radius: 12px;
				z-index: 100;
				font-size: 14px;
				font-family: monospace;
				box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
			}
			#statusPanel div {
				margin-bottom: 5px;
			}
			
			/* --- Toggle Button Styling (outside main panel) --- */
			#toggleControlsBtn {
				position: absolute;
				top: 10px;
				left: 10px;
				z-index: 101;
				padding: 8px 15px;
				background: #2196f3; /* Blue background for visibility */
				color: white;
				border: none;
				border-radius: 6px;
				cursor: pointer;
				font-weight: bold;
				transition: background 0.2s ease, transform 0.1s ease;
				box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
				transition: left 0.3s ease; /* Transition for position change */
			}
			#toggleControlsBtn.controls-visible {
				left: 310px; /* Position next to the controls when visible (adjust based on panel width) */
			}
			#toggleControlsBtn:hover {
				background: #1976d2;
			}
			
			/* --- Input and General Control Styling (from previous version) --- */
			.controls div {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 10px;
			}
			.controls label {
				min-width: 90px;
				font-weight: bold;
				color: #e0e0e0;
			}
			.controls .file-input-group label.custom-file-label {
				cursor: pointer;
				flex: 1;
				min-width: 80px;
				padding: 10px 15px;
				background: linear-gradient(145deg, #6a82fb, #fc5c7d);
				color: white;
				border: none;
				border-radius: 6px;
				font-weight: bold;
				transition: background 0.3s ease, transform 0.1s ease;
				box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
				text-transform: uppercase;
				letter-spacing: 0.5px;
				text-align: center;
			}
			.controls .file-input-group label.custom-file-label:hover {
				background: linear-gradient(145deg, #5c75e8, #e84c6c);
				transform: translateY(-2px);
			}
			.controls .file-input-group input[type="file"] {
				display: none;
			}
			.controls button {
				flex: 1;
				min-width: 80px;
				padding: 10px 15px;
				background: linear-gradient(145deg, #6a82fb, #fc5c7d);
				color: white;
				border: none;
				border-radius: 6px;
				cursor: pointer;
				font-weight: bold;
				transition: background 0.3s ease, transform 0.1s ease;
				box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
				text-transform: uppercase;
				letter-spacing: 0.5px;
			}
			.controls button:hover {
				background: linear-gradient(145deg, #5c75e8, #e84c6c);
				transform: translateY(-2px);
			}
			.controls button:active {
				transform: translateY(1px);
			}
			.controls button:disabled {
				background: #666;
				cursor: not-allowed;
				opacity: 0.7;
				box-shadow: none;
				transform: none;
			}
			.status-text {
				margin-top: 10px;
				font-size: 14px;
				color: #ccc;
				text-align: center;
			}
		</style>
	</head>

	<body>
		<button id="toggleControlsBtn">Hide Menu</button>
		
		<div class="controls" id="controlsPanel">
			<div class="file-input-group">
				<label>VRM Model:</label>
				<input type="file" id="vrmFileInput" accept=".vrm" />
				<label for="vrmFileInput" class="custom-file-label">Open VRM</label>
				<span id="vrmFileName">No file selected</span>
			</div>
			
			<div class="file-input-group">
				<label>VRMA Animation:</label>
				<input type="file" id="vrmaFileInput" accept=".vrma" disabled />
				<label for="vrmaFileInput" class="custom-file-label" id="vrmaFileLabel">Open VRMA</label>
				<span id="vrmaFileName">No file selected</span>
			</div>

			<div>
				<button id="playBtn" disabled>Play</button>
				<button id="pauseBtn" disabled>Pause</button>
				<button id="stopBtn" disabled>Stop</button>
			</div>
			<div class="status-text" id="status">Please select a file to start.</div>
		</div>

		<div id="statusPanel">
			<div id="fpsDisplay">FPS: --</div>
			<div id="modelNameDisplay">Model: None</div>
			<div id="modelBonesDisplay">Bones: 0</div>
			<div id="modelMorphsDisplay">Morphs: 0</div>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/",
					"@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js",
					"@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3/lib/three-vrm-animation.module.min.js"
				}
			}
		</script>

		<script type="module">
			import * as THREE from 'three';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
			import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from '@pixiv/three-vrm-animation';

			// --- DOM elements ---
			const controlsPanel = document.getElementById('controlsPanel');
			const toggleControlsBtn = document.getElementById('toggleControlsBtn');
			const vrmFileInput = document.getElementById('vrmFileInput');
			const vrmaFileInput = document.getElementById('vrmaFileInput');
			const vrmaFileLabel = document.getElementById('vrmaFileLabel');
			const vrmFileNameSpan = document.getElementById('vrmFileName');
			const vrmaFileNameSpan = document.getElementById('vrmaFileName');
			const playBtn = document.getElementById('playBtn');
			const pauseBtn = document.getElementById('pauseBtn');
			const stopBtn = document.getElementById('stopBtn');
			const statusDiv = document.getElementById('status');
			
			// New Status Panel elements
			const fpsDisplay = document.getElementById('fpsDisplay');
			const modelNameDisplay = document.getElementById('modelNameDisplay');
			const modelBonesDisplay = document.getElementById('modelBonesDisplay');
			const modelMorphsDisplay = document.getElementById('modelMorphsDisplay');


			// --- Three.js Setup ---
			const renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.outputColorSpace = THREE.SRGBColorSpace; 
			document.body.appendChild( renderer.domElement );

			const camera = new THREE.PerspectiveCamera( 30.0, window.innerWidth / window.innerHeight, 0.1, 20.0 );
			camera.position.set( 0.0, 1.0, 5.0 );

			const controls = new OrbitControls( camera, renderer.domElement );
			controls.screenSpacePanning = true;
			controls.target.set( 0.0, 1.0, 0.0 );
			controls.update();

			const scene = new THREE.Scene();
			scene.background = new THREE.Color(0x222222);

			const light = new THREE.DirectionalLight( 0xffffff, 3.0 );
			light.position.set( 1.0, 1.0, 1.0 ).normalize();
			scene.add( light );

			const ambientLight = new THREE.AmbientLight( 0xffffff, 1.0 );
			scene.add( ambientLight );

			// --- Global Variables for VRM and Animation ---
			let currentVrm = undefined;
			let currentMixer = undefined;
			let currentAction = undefined;
			let vrmaAnimationClip = undefined;

			// --- FPS Calculation Variables ---
			let frameCount = 0;
			let lastTime = performance.now();
			let fps = 0;

			// --- GLTF Loader with VRM and VRMA Plugins ---
			const loader = new GLTFLoader();
			loader.crossOrigin = 'anonymous';

			loader.register( ( parser ) => new VRMLoaderPlugin( parser ) );
			loader.register( ( parser ) => new VRMAnimationLoaderPlugin( parser ) );
			
			// --- File Loading Functions ---
			
			/**
			 * Loads a VRM model from a File object.
			 * @param {File} file The VRM File object.
			 */
			async function loadVRMFromFile(file) {
				const url = URL.createObjectURL(file);
				
				stopAnimation();
				vrmaAnimationClip = undefined;
				vrmaFileNameSpan.textContent = 'No file selected';
				updateModelData(null); // Clear old model data
				
				try {
					statusDiv.textContent = 'Loading VRM model...';
					
					await new Promise((resolve, reject) => {
						loader.load(
							url,
							(gltf) => {
								const vrm = gltf.userData.vrm;
								
								VRMUtils.removeUnnecessaryVertices( gltf.scene );
								VRMUtils.combineSkeletons( gltf.scene );
								VRMUtils.combineMorphs( vrm );

								vrm.scene.traverse( ( obj ) => {
									obj.frustumCulled = false;
								} );

								if (currentVrm) {
									scene.remove(currentVrm.scene);
									// FIX: Removed the line currentVrm.dispose() which caused the TypeError.
								}

								scene.add( vrm.scene );
								vrm.scene.rotation.y = Math.PI;
								currentVrm = vrm;
								
								currentMixer = new THREE.AnimationMixer( vrm.scene );
								
								statusDiv.textContent = `VRM model "${file.name}" loaded successfully!`;
								vrmFileNameSpan.textContent = file.name;
								
								// Update status panel with model info
								const boneCount = vrm.humanoid?.humanBones?.length || 0;
								const morphCount = vrm.morpher?.morphTargetDictionary ? Object.keys(vrm.morpher.morphTargetDictionary).length : 0;
								updateModelData(file.name, boneCount, morphCount);
								
								URL.revokeObjectURL(url);
								resolve(vrm);
							},
							(progress) => {
								const percent = (100.0 * ( progress.loaded / progress.total )).toFixed(1);
								statusDiv.textContent = `Loading VRM model... ${percent}%`;
							},
							(error) => {
								console.error('Error loading VRM:', error);
								statusDiv.textContent = 'An error occurred while loading the VRM model: ' + error.message;
								URL.revokeObjectURL(url);
								reject(error);
							}
						);
					});
				} catch (error) {
					console.error('Error in loadVRMFromFile:', error);
					statusDiv.textContent = 'An error occurred while loading the VRM model';
				} finally {
					updateButtons();
				}
			}

			/**
			 * Loads a VRMA animation from a File object and converts it to a THREE.AnimationClip.
			 * @param {File} file The VRMA File object.
			 */
			async function loadVRMAFromFile(file) {
				if (!currentVrm) {
					statusDiv.textContent = 'VRM model is not loaded. Please load the VRM model first.';
					return;
				}
				
				const url = URL.createObjectURL(file);
				
				stopAnimation();
				vrmaAnimationClip = undefined;

				try {
					statusDiv.textContent = 'Loading VRMA animation...';
					
					await new Promise((resolve, reject) => {
						loader.load(
							url,
							(gltf) => {
								const vrmAnimationData = gltf.userData.vrmAnimations && gltf.userData.vrmAnimations[0];

								if (vrmAnimationData) {
									const clip = createVRMAnimationClip(vrmAnimationData, currentVrm);
									
									if (clip) {
										vrmaAnimationClip = clip;
										statusDiv.textContent = `Animation "${file.name}" loaded successfully!`;
										vrmaFileNameSpan.textContent = file.name;
										resolve(clip);
									} else {
										throw new Error('Could not create AnimationClip from VRMA data.');
									}
								} else {
									throw new Error('No valid VRMA animation found in the file.');
								}
							},
							(progress) => {
								const percent = (100.0 * ( progress.loaded / progress.total )).toFixed(1);
								statusDiv.textContent = `Loading VRMA animation... ${percent}%`;
							},
							(error) => {
								console.error('Error loading animation:', error);
								statusDiv.textContent = 'An error occurred while loading the animation file: ' + error.message;
								URL.revokeObjectURL(url);
								reject(error);
							}
						);
					});
				} catch (error) {
					console.error('Error in loadVRMAFromFile:', error);
					statusDiv.textContent = 'An error occurred while loading the animation file';
				} finally {
					updateButtons();
				}
			}

			// --- Animation Control Functions ---
			
			function playAnimation() {
				if (currentVrm && vrmaAnimationClip && currentMixer) {
					if (currentAction) {
						currentAction.stop();
					}
					
					try {
						currentAction = currentMixer.clipAction(vrmaAnimationClip);
						currentAction.setLoop(THREE.LoopRepeat);
						currentAction.clampWhenFinished = true;
						currentAction.reset();
						currentAction.play();
						
						statusDiv.textContent = `Playing animation (${vrmaAnimationClip.duration.toFixed(2)}s)`;
					} catch (error) {
						console.error('Error playing animation:', error);
						statusDiv.textContent = 'An error occurred while playing the animation: ' + error.message;
					}
				} else {
					statusDiv.textContent = 'The VRM model and animation must be loaded.';
				}
			}

			function pauseAnimation() {
				if (currentAction) {
					currentAction.paused = !currentAction.paused;
					statusDiv.textContent = currentAction.paused ? 'Animation paused' : 'Playing animation...';
				}
			}

			function stopAnimation() {
				if (currentAction) {
					currentAction.stop();
					currentAction = undefined;
					currentMixer?.stopAllAction();
					currentVrm?.humanoid.resetPose();
					statusDiv.textContent = 'Animation stopped.';
				}
			}

			// --- UI and Status Handlers ---
			
			/** Updates the state of the control buttons. */
			function updateButtons() {
				const hasVrm = currentVrm !== undefined;
				const hasVrma = vrmaAnimationClip !== undefined;
				
				vrmaFileInput.disabled = !hasVrm;
				vrmaFileLabel.style.opacity = hasVrm ? 1 : 0.5;

				playBtn.disabled = !(hasVrm && hasVrma);
				pauseBtn.disabled = !(hasVrm && hasVrma);
				stopBtn.disabled = !(hasVrm && hasVrma);
			}

			/** Updates the new status panel with model data. */
			function updateModelData(name, bones = 0, morphs = 0) {
				if (name) {
					modelNameDisplay.textContent = `Model: ${name.length > 20 ? name.substring(0, 17) + '...' : name}`;
					modelBonesDisplay.textContent = `Bones: ${bones}`;
					modelMorphsDisplay.textContent = `Morphs: ${morphs}`;
				} else {
					modelNameDisplay.textContent = `Model: None`;
					modelBonesDisplay.textContent = `Bones: 0`;
					modelMorphsDisplay.textContent = `Morphs: 0`;
				}
			}
			
			/** Toggles the visibility of the main controls panel. */
			function toggleControlsPanel() {
				const isHidden = controlsPanel.classList.toggle('hidden');
				toggleControlsBtn.textContent = isHidden ? 'Show Menu' : 'Hide Menu';
				toggleControlsBtn.classList.toggle('controls-visible', !isHidden);
			}

			// --- Event Listeners ---
			
			toggleControlsBtn.addEventListener('click', toggleControlsPanel);

			vrmFileInput.addEventListener('change', async (event) => {
				const file = event.target.files[0];
				if (file) {
					await loadVRMFromFile(file);
					vrmaFileInput.value = '';
					updateButtons();
				}
			});
			
			vrmaFileInput.addEventListener('change', async (event) => {
				const file = event.target.files[0];
				if (file) {
					await loadVRMAFromFile(file);
					updateButtons();
				}
			});

			playBtn.addEventListener('click', playAnimation);
			pauseBtn.addEventListener('click', pauseAnimation);
			stopBtn.addEventListener('click', stopAnimation);

			window.addEventListener('resize', () => {
				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize(window.innerWidth, window.innerHeight);
			});

			// --- Helpers ---
			const gridHelper = new THREE.GridHelper( 10, 10 );
			scene.add( gridHelper );

			const axesHelper = new THREE.AxesHelper( 5 );
			scene.add( axesHelper );

			// --- Animation Loop ---
			const clock = new THREE.Clock();

			function animate() {
				requestAnimationFrame( animate );

				const deltaTime = clock.getDelta();

				// FPS calculation
				frameCount++;
				const currentTime = performance.now();
				if (currentTime > lastTime + 1000) { // Update FPS every second
					fps = (frameCount * 1000) / (currentTime - lastTime);
					fpsDisplay.textContent = `FPS: ${fps.toFixed(1)}`;
					lastTime = currentTime;
					frameCount = 0;
				}

				if ( currentVrm ) {
					currentVrm.update( deltaTime );
				}
				if ( currentMixer ) {
					currentMixer.update( deltaTime );
				}

				controls.update();
				renderer.render( scene, camera );
			}

			animate();

			// Initial setup
			window.addEventListener('DOMContentLoaded', () => {
				updateButtons();
				updateModelData(null); // Initialize status panel
			});
		</script>
	</body>
</html>
